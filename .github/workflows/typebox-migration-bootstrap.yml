name: TypeBox migration bootstrap

# Branch-only migration helper; removed from the final PR diff.
on:
  push:
    branches: [refactor/typebox-schemas]
permissions:
  contents: write
jobs:
  bootstrap:
    if: >-
      github.event.head_commit.message == 'refactor: migrate schemas to TypeBox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Migrate schema call sites and regenerate lockfile
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const path of ['packages/core/src/codec.ts', 'packages/core/src/core.test.ts']) {
            let source = readFileSync(path, 'utf8');
            source = source.replace(/\b([A-Z][A-Za-z]+Schema)\.parse\(/g, 'parseSchema($1, ');
            if (!source.includes('  parseSchema,\n')) source = source.replace('  ACB_', '  parseSchema,\n  ACB_');
            writeFileSync(path, source);
          }
          JS
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/codec.ts packages/core/src/core.test.ts package-lock.json
          git diff --cached --quiet || git commit -m 'refactor: update TypeBox call sites and npm lockfile'
          git push origin HEAD:refs/heads/refactor/typebox-schemas
      - name: Install locked dependencies
        run: npm ci
      - name: Build, typecheck, test, and validate site
        run: npm run check
