[package]
name = "agentconfig"
version = "0.1.0"
edition = "2021"
description = "Official Rust SDK for AgentConfig Bundle"
license = "MIT"
repository = "https://github.com/vibeunion/agentconfig"

[dependencies]
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
rand = "0.8"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
