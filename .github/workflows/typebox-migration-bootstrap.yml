name: TypeBox migration bootstrap

# Temporary development-branch helper. Removed before the migration PR is ready.
on:
  push:
    branches: [refactor/typebox-schemas]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'chore: prepare TypeBox migration dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate the lockfile with npm
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet || git commit -m 'chore: regenerate lockfile for TypeBox'
          git push origin HEAD:refs/heads/refactor/typebox-schemas
      - name: Install development dependencies
        run: npm ci
      - name: Prepare validation workspace
        run: tar --exclude='./.git' --exclude='./typebox-workspace.tar.gz' -czf typebox-workspace.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: typebox-validation-workspace
          path: typebox-workspace.tar.gz
          retention-days: 1
