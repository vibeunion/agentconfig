name: TypeBox migration bootstrap

# Branch-only migration helper; removed from the final PR diff.
on:
  push:
    branches: [refactor/typebox-schemas]
permissions:
  contents: write
jobs:
  bootstrap:
    if: >-
      github.event.head_commit.message == 'refactor: migrate schemas to TypeBox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply verified TypeBox API fixes
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'packages/core/src/schema.ts';
          let source = readFileSync(path, 'utf8');
          source = source.replace('Type.Clone(schema, { default: value })', 'Object.assign(Value.Clone(schema), { default: value })');
          source = source.replace("input === undefined && Object.hasOwn(schema, 'default')", "input === undefined && 'default' in schema && Object.hasOwn(schema, 'default')");
          writeFileSync(path, source);
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/schema.ts
          git diff --cached --quiet || git commit -m 'fix: use TypeBox value clone and narrow default metadata'
          git push origin HEAD:refs/heads/refactor/typebox-schemas
      - name: Install locked dependencies
        run: npm ci
      - name: Build, typecheck, test, and validate site
        run: npm run check
      - name: Report dependency audit
        if: always()
        run: |
          npm audit --json > /tmp/typebox-audit.json || true
          node -e "const a=require('/tmp/typebox-audit.json'); console.log(JSON.stringify(a.vulnerabilities ?? {}, null, 2))"
