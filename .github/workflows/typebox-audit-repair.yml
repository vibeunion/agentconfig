name: TypeBox audit repair
# Temporary branch-only lockfile maintenance; removed before merge.
on:
  push:
    branches: [refactor/typebox-schemas]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'chore: repair TypeBox branch dependency audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply compatible advisory fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=low
      - name: Commit validated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git diff --cached --quiet || git commit -m 'fix(deps): resolve build dependency security advisories'
          git push origin HEAD:refs/heads/refactor/typebox-schemas
      - name: Package review workspace without Git credentials
        run: |
          tar --exclude='./.git' -czf "$RUNNER_TEMP/agentconfig-workspace.tar.gz" .
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: agentconfig-repaired-workspace
          path: |
            ${{ runner.temp }}/agentconfig-workspace.tar.gz
            ${{ runner.temp }}/source-sha.txt
          retention-days: 1
